name: Deploy FP Messenger to GitHub Pages

on:
  push:
    branches:
      - claude/messenger-replica-analysis-ekbf47
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo una ejecución concurrente; no cancela despliegues en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact (carpeta fp-messenger)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fp-messenger

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
